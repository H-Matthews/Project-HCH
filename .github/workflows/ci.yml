# Workflow Name
name: CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  format-check:
    name: Format Check
    # Pinned: scripts/format.sh requires clang-format 18, which newer images may not package.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format-18

    # Logged so a CI-only failure can be compared against a local run (clang-format version, line endings).
    - name: Show formatter environment
      run: |
        apt-cache policy clang-format-18 | head -n 3
        clang-format-18 --version
        git ls-files --eol -- '*.cpp' '*.hpp' '*.cc' | awk '{print $1, $2}' | sort | uniq -c

    - name: Run format check
      run: ./scripts/format.sh --check

  build:
    name: ${{ matrix.platform.name }} Static
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows VS2022, os: windows-2022,  preset: windows-VS22 }
        - { name: Windows VS2025, os: windows-2025,  preset: windows-VS25 }
        - { name: Linux GCC,      os: ubuntu-latest, preset: release-unix_makefiles }
        - { name: macOS,          os: macos-latest,  preset: release-unix_makefiles }

    steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install libxrandr-dev libxcursor-dev libxi-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev libfreetype-dev
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Build Files
      run: cmake --preset ${{ matrix.platform.preset }}

    - name: Build Code
      run: cmake --build --preset ${{ matrix.platform.preset }} --config Release

    - name: Run All GTest Binaries
      run: ctest --preset ${{ matrix.platform.preset }} -C Release --output-on-failure
